# 按键合并到 ~/.codex/config.toml 或 ccswitch 管理的用户级配置
# 不要重复追加已有的 [features] 或 [mcp_servers.agenttoolgate] 表
# 把 <repo> 替换为 Codex 规范化后的项目绝对路径
# Windows 使用小写、反斜杠形式；TOML 单引号会原样保留反斜杠
# 项目信任不等于 Hook 内容信任
[projects.'<repo>']
trust_level = "trusted"

[features]
hooks = true

[mcp_servers.agenttoolgate]
url = "http://127.0.0.1:8080/mcp"
default_tools_approval_mode = "approve"

# 可选命令等价参考：codex mcp add agenttoolgate --url http://127.0.0.1:8080/mcp
# 启动 Codex 后在 /hooks 中核对命令和当前 Hash，再由用户显式信任
