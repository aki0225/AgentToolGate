name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_evidence_tag:
        description: "复跑正式 Release 评估附件；留空则只运行常规手动 CI"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum

      - name: Test
        run: go test -count=1 -timeout 60s ./...

      - name: Vet
        run: go vet ./...

  backend-windows:
    name: Go Windows
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum

      - name: Test
        run: go test -count=1 -timeout 60s ./...

      - name: Vet
        run: go vet ./...

      - name: Test local cache environment
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/tests/local-cache-env.tests.ps1

      - name: Test local PostgreSQL lifecycle
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/tests/verify-local-postgres.tests.ps1

  backend-postgres:
    name: Go Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agenttoolgate
          POSTGRES_USER: agenttoolgate
          POSTGRES_PASSWORD: agenttoolgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenttoolgate -d agenttoolgate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://agenttoolgate:agenttoolgate@127.0.0.1:5432/agenttoolgate?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if bash -lc 'exec 3<>/dev/tcp/127.0.0.1/5432' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Test Postgres coverage
        run: go test -count=1 -timeout 60s ./internal/store ./internal/app

  evaluation:
    name: Agent Safety Evaluation Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATG_EVAL_REQUIRE_PYTHON: "1"
      GOCACHE: ${{ github.workspace }}/.tmp/ci-go-cache
      GOMODCACHE: ${{ github.workspace }}/.tmp/ci-go-mod-cache
      GOPATH: ${{ github.workspace }}/.tmp/ci-gopath
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python
        run: python --version

      - name: Test Codex Hook Bridge
        run: python .codex/hooks/test_agent_guard_pretool.py

      - name: Test Claude Hook Bridge
        run: python .claude/hooks/test_agent_guard_pretool.py

      - name: Test real Codex evidence scripts
        run: python -m unittest discover -s scripts/real-codex-demo -p "test_*.py"

      - name: Test release tag validation
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/tests/validate-release-tag.tests.ps1

      - name: Test evaluation tool
        run: go -C tools/atg-eval test -count=1 -timeout 60s ./...

      - name: Vet evaluation tool
        run: go -C tools/atg-eval vet ./...

      - name: Build evaluation binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/ci-bin
          go -C backend build -buildvcs=false -o "$GITHUB_WORKSPACE/.tmp/ci-bin/agenttoolgate-backend" ./cmd/server
          go -C tools/atg-eval build -buildvcs=false -o "$GITHUB_WORKSPACE/.tmp/ci-bin/atg-eval" .

      - name: Validate dangerous actions suite
        run: ./.tmp/ci-bin/atg-eval validate --input evaluation/suites/dangerous-actions-v1.jsonl

      - name: Validate benign development suite
        run: ./.tmp/ci-bin/atg-eval validate --input evaluation/suites/benign-development-v1.jsonl

      - name: Validate governance invariants suite
        run: ./.tmp/ci-bin/atg-eval validate --input evaluation/suites/governance-invariants-v1.jsonl

      - name: Validate PR quick suite composition
        shell: bash
        run: |
          set -euo pipefail
          ./.tmp/ci-bin/atg-eval validate --input evaluation/suites/pr-quick-v1.jsonl
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path("evaluation/suites/pr-quick-v1.jsonl")
          cases = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          counts = Counter(case["suite"] for case in cases)
          expected = Counter({
              "dangerous-actions-v1": 6,
              "benign-development-v1": 8,
              "governance-invariants-v1": 6,
          })
          if counts != expected or len({case["id"] for case in cases}) != 20:
              raise SystemExit(f"PR quick suite 必须是 6+8+6 且 ID 唯一，实际={counts}")
          PY

      - name: Run PR quick evaluation
        shell: bash
        run: |
          set -uo pipefail
          run_id="pr-quick-${GITHUB_RUN_ID}"
          output_root="$GITHUB_WORKSPACE/.tmp/ci-proof-packs"
          output="$output_root/quick"
          sandbox="$GITHUB_WORKSPACE/.tmp/ci-sandboxes/quick"
          log_dir="$GITHUB_WORKSPACE/.tmp/ci-logs/quick"
          mkdir -p "$output_root" "$sandbox" "$log_dir"
          eval_bin="$GITHUB_WORKSPACE/.tmp/ci-bin/atg-eval"
          backend_bin="$GITHUB_WORKSPACE/.tmp/ci-bin/agenttoolgate-backend"
          set +e
          "$eval_bin" run \
            --input evaluation/suites/pr-quick-v1.jsonl \
            --atg "$backend_bin" \
            --run-id "$run_id" \
            --output "$output" \
            --sandbox-base "$sandbox" \
            >"$log_dir/stdout.json" 2>"$log_dir/stderr.log"
          status=$?
          set -e
          cat "$log_dir/stderr.log" >&2 || true
          exit "$status"

      - name: Upload PR quick Proof Pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-safety-proof-pack-quick-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .tmp/ci-proof-packs/quick
            .tmp/ci-logs/quick

  evaluation-full:
    name: Agent Safety Evaluation Full (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            exe_suffix: ""
          - os: windows-latest
            platform: windows
            exe_suffix: ".exe"
    env:
      ATG_EVAL_REQUIRE_PYTHON: "1"
      GOCACHE: ${{ github.workspace }}/.tmp/ci-go-cache
      GOMODCACHE: ${{ github.workspace }}/.tmp/ci-go-mod-cache
      GOPATH: ${{ github.workspace }}/.tmp/ci-gopath
      EVAL_PLATFORM: ${{ matrix.platform }}
      EVAL_EXE_SUFFIX: ${{ matrix.exe_suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python
        run: python --version

      - name: Build evaluation binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $workspace = $env:GITHUB_WORKSPACE
          $binDir = Join-Path $workspace ".tmp/ci-bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $backendBin = Join-Path $binDir ("agenttoolgate-backend" + $env:EVAL_EXE_SUFFIX)
          $evalBin = Join-Path $binDir ("atg-eval" + $env:EVAL_EXE_SUFFIX)
          Push-Location $workspace
          try {
            go -C backend build -buildvcs=false -o $backendBin ./cmd/server
            go -C tools/atg-eval build -buildvcs=false -o $evalBin .
          } finally {
            Pop-Location
          }

      - name: Run full evaluation suites
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $binDir = Join-Path $workspace ".tmp/ci-bin"
          $evalBin = Join-Path $binDir ("atg-eval" + $env:EVAL_EXE_SUFFIX)
          $backendBin = Join-Path $binDir ("agenttoolgate-backend" + $env:EVAL_EXE_SUFFIX)
          $outputRoot = Join-Path $workspace (".tmp/ci-proof-packs/full/" + $env:EVAL_PLATFORM)
          $sandboxRoot = Join-Path $workspace (".tmp/ci-sandboxes/full/" + $env:EVAL_PLATFORM)
          $logRoot = Join-Path $workspace (".tmp/ci-logs/full/" + $env:EVAL_PLATFORM)
          New-Item -ItemType Directory -Force -Path $outputRoot, $sandboxRoot, $logRoot | Out-Null
          $suites = @(
            @{ Name = "dangerous"; Input = "evaluation/suites/dangerous-actions-v1.jsonl" },
            @{ Name = "benign"; Input = "evaluation/suites/benign-development-v1.jsonl" },
            @{ Name = "governance"; Input = "evaluation/suites/governance-invariants-v1.jsonl" }
          )
          $failures = 0
          foreach ($suite in $suites) {
            $runId = "full-$($env:GITHUB_RUN_ID)-$($env:EVAL_PLATFORM)-$($suite.Name)"
            $output = Join-Path $outputRoot $suite.Name
            $stdoutPath = Join-Path $logRoot ($suite.Name + ".stdout.json")
            $stderrPath = Join-Path $logRoot ($suite.Name + ".stderr.log")
            & $evalBin run --input $suite.Input --atg $backendBin --run-id $runId --output $output --sandbox-base $sandboxRoot 1> $stdoutPath 2> $stderrPath
            $status = $LASTEXITCODE
            if (Test-Path $stderrPath) { Get-Content $stderrPath | Write-Host }
            if ($status -ne 0) {
              $failures++
              Write-Host "suite=$($suite.Name) exit_code=$status"
            }
          }
          if ($failures -ne 0) { exit 1 }

      - name: Upload full Proof Pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-safety-proof-pack-full-${{ matrix.platform }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .tmp/ci-proof-packs/full/${{ matrix.platform }}
            .tmp/ci-logs/full/${{ matrix.platform }}

  release-evaluation:
    name: Release Evaluation (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.release_evidence_tag != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
            proof_platform: windows
            asset_id: 516783373
            asset_size: 29876035
            asset_sha256: cc39b6af9dfde8c9958bdf012d6bfdd9ec7a093b212760557f83e040321da246
            include_quick: "false"
          - os: ubuntu-latest
            platform: linux-amd64
            proof_platform: linux
            asset_id: 516783402
            asset_size: 29129053
            asset_sha256: dcd4d2f85a499036cead94611d7209f9166c29ffbb61fd3431fa4e111216bfbc
            include_quick: "true"
    env:
      REQUESTED_RELEASE_TAG: ${{ inputs.release_evidence_tag }}
      RELEASE_COMMIT: 43868521e56c85cf074e92f572daff49121651b9
      RELEASE_ID: "371316925"
      RELEASE_CHECKSUMS_SHA256: b203ec978d7da9b4add09c80e41cdef4971be8d590f601131f75012a65763e6e
      RELEASE_ASSET_ID: ${{ matrix.asset_id }}
      RELEASE_ASSET_SIZE: ${{ matrix.asset_size }}
      RELEASE_ASSET_SHA256: ${{ matrix.asset_sha256 }}
      RELEASE_INCLUDE_QUICK: ${{ matrix.include_quick }}
    steps:
      - name: Checkout evidence tooling
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run formal Release evaluation package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:REQUESTED_RELEASE_TAG -ne "v0.4.1") {
            throw "当前证据任务只允许复跑 v0.4.1"
          }
          $arguments = @(
            "-Platform", "${{ matrix.platform }}",
            "-ReleaseTag", $env:REQUESTED_RELEASE_TAG,
            "-ReleaseCommit", $env:RELEASE_COMMIT,
            "-ReleaseId", $env:RELEASE_ID,
            "-AssetId", $env:RELEASE_ASSET_ID,
            "-AssetSHA256", $env:RELEASE_ASSET_SHA256,
            "-AssetSizeBytes", $env:RELEASE_ASSET_SIZE,
            "-ChecksumsSHA256", $env:RELEASE_CHECKSUMS_SHA256,
            "-WorkingRoot", (Join-Path $env:GITHUB_WORKSPACE ".tmp/release-evaluation/${{ matrix.platform }}"),
            "-ArtifactRoot", (Join-Path $env:GITHUB_WORKSPACE ".tmp/release-proof-artifacts/${{ matrix.platform }}"),
            "-WorkflowRunId", $env:GITHUB_RUN_ID,
            "-WorkflowRunAttempt", $env:GITHUB_RUN_ATTEMPT,
            "-WorkflowHeadSha", $env:GITHUB_SHA,
            "-WorkflowRef", $env:GITHUB_REF
          )
          if ($env:RELEASE_INCLUDE_QUICK -eq "true") {
            $arguments += "-IncludeQuick"
          }
          & ./scripts/run-release-evaluation.ps1 @arguments

      - name: Upload formal Release full Proof Pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-safety-release-proof-pack-full-${{ matrix.proof_platform }}-v0.4.1-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .tmp/release-proof-artifacts/${{ matrix.platform }}/provenance.json
            .tmp/release-proof-artifacts/${{ matrix.platform }}/ci-proof-packs/full/${{ matrix.proof_platform }}
            .tmp/release-proof-artifacts/${{ matrix.platform }}/ci-logs/full/${{ matrix.proof_platform }}

      - name: Upload formal Release quick Proof Pack
        if: always() && matrix.include_quick == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-safety-release-proof-pack-quick-v0.4.1-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .tmp/release-proof-artifacts/${{ matrix.platform }}/provenance.json
            .tmp/release-proof-artifacts/${{ matrix.platform }}/ci-proof-packs/quick
            .tmp/release-proof-artifacts/${{ matrix.platform }}/ci-logs/quick

  frontend:
    name: Node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

  website:
    name: 产品展示站
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright Chromium
        run: npm run playwright:install

      - name: 执行静态检查
        run: npm run check

      - name: 运行单元测试
        run: npm test

      - name: 构建展示站
        run: npm run build

      - name: 运行展示站 E2E
        run: npm run e2e

      - name: 失败时上传展示站 Playwright 诊断产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-playwright-artifacts
          path: |
            website/playwright-report
            website/test-results

  smoke:
    name: 核心 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend
    env:
      AGT_DEMO_HTTP_API_KEY: local-demo-secret-for-e2e
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      DEFAULT_WORKSPACE_ORG_ID: local-org
      DEFAULT_WORKSPACE_SLUG: default
      E2E_API_BASE_URL: http://127.0.0.1:8080
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_BROWSER_CHANNEL: chrome
      E2E_HTTP_MOCK_CONNECT_HOST: 127.0.0.1
      E2E_HTTP_MOCK_LISTEN_HOST: 127.0.0.1
      E2E_HTTP_MOCK_PORT: "18080"
      E2E_MCP_MOCK_CONNECT_HOST: 127.0.0.1
      E2E_MCP_MOCK_LISTEN_HOST: 127.0.0.1
      E2E_MCP_MOCK_PORT: "38081"
      E2E_VIDEO: "off"
      HOST: 127.0.0.1
      HTTP_ALLOWED_HOSTS: 127.0.0.1:18080,localhost:18080
      LOCAL_EMAIL: ci@example.com
      LOCAL_NAME: CI Dev
      LOCAL_ROLE: owner
      LOCAL_SUBJECT: ci-dev
      AUTH_MODE: local
      MCP_ALLOWED_HOSTS: 127.0.0.1:38081
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      POLICY_CONFIG_PATH: ../configs/policies.yaml
      PORT: "8080"
      STORE_DRIVER: memory
      VITE_API_BASE_URL: http://127.0.0.1:8080
      VITE_AUTH_MODE: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 启动 backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          backend_log="$RUNNER_TEMP/agenttoolgate-backend.log"
          backend_bin="$RUNNER_TEMP/agenttoolgate"
          go build -o "$backend_bin" ./cmd/server
          export AGT_DATA_DIR="$RUNNER_TEMP/agt"
          nohup "$backend_bin" >"$backend_log" 2>&1 &
          echo $! > "$RUNNER_TEMP/agenttoolgate-backend.pid"
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$backend_log" || true
          exit 1
        working-directory: backend

      - name: 启动 frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          frontend_log="$RUNNER_TEMP/agenttoolgate-frontend.log"
          nohup npm run dev -- --host 127.0.0.1 --port 5173 --strictPort >"$frontend_log" 2>&1 &
          echo $! > "$RUNNER_TEMP/agenttoolgate-frontend.pid"
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$frontend_log" || true
          exit 1
        working-directory: frontend

      - name: 运行核心 smoke
        working-directory: frontend
        run: npm run e2e -- e2e/smoke.spec.ts

      - name: 运行前端可靠性回归
        working-directory: frontend
        run: npm run e2e -- e2e/frontend-reliability.spec.ts e2e/approval-stream-client.spec.ts

      - name: 运行审批与策略安全回归
        working-directory: frontend
        run: npm run e2e -- e2e/approval-usability.spec.ts e2e/policies-role-guard.spec.ts e2e/local-real-demo.spec.ts

      - name: 运行 Connector 回归
        working-directory: frontend
        run: npm run e2e -- e2e/connectors.spec.ts

      - name: 失败时上传 Playwright 诊断产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/agenttoolgate-backend.log
            ${{ runner.temp }}/agenttoolgate-frontend.log

      - name: 停止 smoke 服务
        if: always()
        shell: bash
        run: |
          set +e
          for pidfile in "$RUNNER_TEMP/agenttoolgate-backend.pid" "$RUNNER_TEMP/agenttoolgate-frontend.pid"; do
            if [[ -f "$pidfile" ]]; then
              pid="$(cat "$pidfile")"
              pkill -TERM -P "$pid" >/dev/null 2>&1 || true
              kill "$pid" >/dev/null 2>&1 || true
            fi
          done

  multi-actor-postgres:
    name: PostgreSQL 多 Actor E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agenttoolgate
          POSTGRES_USER: agenttoolgate
          POSTGRES_PASSWORD: agenttoolgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenttoolgate -d agenttoolgate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      DATABASE_URL: postgres://agenttoolgate:agenttoolgate@127.0.0.1:5432/agenttoolgate?sslmode=disable
      DEFAULT_WORKSPACE_ORG_ID: local-org
      E2E_API_BASE_URL: http://127.0.0.1:8080
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_BROWSER_CHANNEL: chrome
      E2E_MULTI_ACTOR_APPROVAL: "1"
      E2E_VIDEO: "off"
      E2E_WORKSPACE_ORG_ID: local-org
      HOST: 127.0.0.1
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      PORT: "8080"
      STORE_DRIVER: postgres
      VITE_API_BASE_URL: http://127.0.0.1:8080
      VITE_AUTH_MODE: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建 backend
        working-directory: backend
        run: go build -buildvcs=false -o "$RUNNER_TEMP/agenttoolgate" ./cmd/server

      - name: 准备两阶段运行标识
        shell: bash
        run: echo "E2E_MULTI_ACTOR_RUN_ID=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: 启动 frontend
        shell: bash
        run: |
          set -euo pipefail
          frontend_log="$RUNNER_TEMP/agenttoolgate-multi-actor-frontend.log"
          nohup npm run dev -- --host 127.0.0.1 --port 5173 --strictPort >"$frontend_log" 2>&1 &
          echo $! > "$RUNNER_TEMP/agenttoolgate-multi-actor-frontend.pid"
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$frontend_log" || true
          exit 1
        working-directory: frontend

      - name: 运行 requester 阶段
        shell: bash
        run: |
          set -euo pipefail
          backend_log="$RUNNER_TEMP/agenttoolgate-multi-actor-requester.log"
          cleanup() {
            if [[ -f "$RUNNER_TEMP/agenttoolgate-multi-actor-backend.pid" ]]; then
              pid="$(cat "$RUNNER_TEMP/agenttoolgate-multi-actor-backend.pid")"
              pkill -TERM -P "$pid" >/dev/null 2>&1 || true
              kill "$pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          nohup env \
            AUTH_MODE=local \
            LOCAL_SUBJECT="requester-${E2E_MULTI_ACTOR_RUN_ID}" \
            LOCAL_EMAIL="requester+${E2E_MULTI_ACTOR_RUN_ID}@agenttoolgate.local" \
            LOCAL_NAME="Requester ${E2E_MULTI_ACTOR_RUN_ID}" \
            LOCAL_ROLE=owner \
            POLICY_CONFIG_PATH="$GITHUB_WORKSPACE/configs/policies.yaml" \
            "$RUNNER_TEMP/agenttoolgate" >"$backend_log" 2>&1 &
          echo $! > "$RUNNER_TEMP/agenttoolgate-multi-actor-backend.pid"
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              E2E_MULTI_ACTOR_PHASE=requester npm run e2e -- e2e/multi-actor-approval.spec.ts
              exit 0
            fi
            sleep 1
          done
          cat "$backend_log" || true
          exit 1
        working-directory: frontend

      - name: 等待 requester backend 退出
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if ! curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: 运行 reviewer 阶段
        shell: bash
        run: |
          set -euo pipefail
          backend_log="$RUNNER_TEMP/agenttoolgate-multi-actor-reviewer.log"
          cleanup() {
            if [[ -f "$RUNNER_TEMP/agenttoolgate-multi-actor-backend.pid" ]]; then
              pid="$(cat "$RUNNER_TEMP/agenttoolgate-multi-actor-backend.pid")"
              pkill -TERM -P "$pid" >/dev/null 2>&1 || true
              kill "$pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          nohup env \
            AUTH_MODE=local \
            LOCAL_SUBJECT="reviewer-${E2E_MULTI_ACTOR_RUN_ID}" \
            LOCAL_EMAIL="reviewer+${E2E_MULTI_ACTOR_RUN_ID}@agenttoolgate.local" \
            LOCAL_NAME="Reviewer ${E2E_MULTI_ACTOR_RUN_ID}" \
            LOCAL_ROLE=approver \
            POLICY_CONFIG_PATH="$GITHUB_WORKSPACE/configs/policies.yaml" \
            "$RUNNER_TEMP/agenttoolgate" >"$backend_log" 2>&1 &
          echo $! > "$RUNNER_TEMP/agenttoolgate-multi-actor-backend.pid"
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              E2E_MULTI_ACTOR_PHASE=reviewer npm run e2e -- e2e/multi-actor-approval.spec.ts
              exit 0
            fi
            sleep 1
          done
          cat "$backend_log" || true
          exit 1
        working-directory: frontend

      - name: 失败时上传多 Actor 诊断产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multi-actor-postgres-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/agenttoolgate-multi-actor-frontend.log
            ${{ runner.temp }}/agenttoolgate-multi-actor-requester.log
            ${{ runner.temp }}/agenttoolgate-multi-actor-reviewer.log

      - name: 停止多 Actor 服务
        if: always()
        shell: bash
        run: |
          set +e
          for pidfile in "$RUNNER_TEMP/agenttoolgate-multi-actor-backend.pid" "$RUNNER_TEMP/agenttoolgate-multi-actor-frontend.pid"; do
            if [[ -f "$pidfile" ]]; then
              pid="$(cat "$pidfile")"
              pkill -TERM -P "$pid" >/dev/null 2>&1 || true
              kill "$pid" >/dev/null 2>&1 || true
            fi
          done
