name: GitHub Release 发版包自动化

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要发布的标签名，例如 v0.1.0"
        required: true
        type: string
      commit_sha:
        description: "标签必须指向的完整 40 位 commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  RELEASE_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.ref }}
  RELEASE_EXPECTED_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || '' }}

jobs:
  validate-release:
    name: 校验标签与打包提交
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
    steps:
      - name: 检出预期提交
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: 校验 SemVer 标签与提交一致
        id: validate
        shell: pwsh
        run: |
          $expectedCommit = $env:RELEASE_EXPECTED_COMMIT_SHA
          if ([string]::IsNullOrWhiteSpace($expectedCommit)) {
            $expectedCommit = (git rev-parse --verify "refs/tags/$env:RELEASE_TAG^{commit}").Trim()
          }
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/validate-release-tag.ps1 `
            -TagName $env:RELEASE_TAG `
            -ExpectedCommitSha $expectedCommit `
            -GitHubOutputPath $env:GITHUB_OUTPUT

      - name: 确认精确提交已有成功 CI
        shell: pwsh
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATED_COMMIT_SHA: ${{ steps.validate.outputs.commit_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedCommit = ([string]$env:VALIDATED_COMMIT_SHA).Trim().ToLowerInvariant()
          if ($expectedCommit -notmatch '^[0-9a-f]{40}$') {
            throw "校验步骤未输出完整的 commit SHA。"
          }
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            throw "GITHUB_TOKEN 不可用，拒绝在未完成 CI 校验时继续。"
          }

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repositoryUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $encodedCommit = [Uri]::EscapeDataString($expectedCommit)
          $successfulRun = $null
          $scanCompleted = $false

          for ($page = 1; $page -le 10; $page++) {
            $runsUri = "$repositoryUri/actions/workflows/ci.yml/runs?head_sha=$encodedCommit&status=completed&per_page=100&page=$page"
            $response = Invoke-RestMethod -Method Get -Uri $runsUri -Headers $headers
            if ($null -eq $response) {
              throw "GitHub Actions API 返回空响应，拒绝在未完成 CI 校验时继续。"
            }

            $workflowRunsProperty = $response.PSObject.Properties["workflow_runs"]
            if ($null -eq $workflowRunsProperty) {
              throw "GitHub Actions API 响应缺少 workflow_runs，拒绝继续。"
            }

            $runs = @($workflowRunsProperty.Value | Where-Object { $null -ne $_ })
            foreach ($run in $runs) {
              if (
                [string]::Equals(
                  [string]$run.head_sha,
                  $expectedCommit,
                  [StringComparison]::OrdinalIgnoreCase
                ) -and
                [string]::Equals(
                  [string]$run.status,
                  "completed",
                  [StringComparison]::OrdinalIgnoreCase
                ) -and
                [string]::Equals(
                  [string]$run.conclusion,
                  "success",
                  [StringComparison]::OrdinalIgnoreCase
                )
              ) {
                $successfulRun = $run
                break
              }
            }

            if ($null -ne $successfulRun) {
              break
            }
            if ($runs.Count -lt 100) {
              $scanCompleted = $true
              break
            }
          }

          if ($null -eq $successfulRun) {
            if (-not $scanCompleted) {
              throw "GitHub Actions CI run 列表达到 API 的 1000 条搜索上限，拒绝在未完成扫描时继续：commit=$expectedCommit"
            }
            throw "未找到 ci.yml 对精确提交 $expectedCommit 的 completed/success workflow run。"
          }

          Write-Host "CI workflow passed for commit=$expectedCommit run_id=$($successfulRun.id)"

      - name: 拒绝覆盖已有 GitHub Release
        shell: pwsh
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repositoryUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"

          function Get-ExactTagReleases {
            $matches = @()
            for ($page = 1; $page -le 1000; $page++) {
              $pageUri = "$repositoryUri/releases?per_page=100&page=$page"
              $releases = @(Invoke-RestMethod -Method Get -Uri $pageUri -Headers $headers)
              foreach ($release in $releases) {
                if ([string]::Equals(
                  [string]$release.tag_name,
                  $env:RELEASE_TAG,
                  [StringComparison]::Ordinal
                )) {
                  $matches += $release
                }
              }
              if ($releases.Count -lt 100) {
                return $matches
              }
            }
            throw "Release 列表超过 1000 页，拒绝在未完成扫描时继续。"
          }

          $existingReleases = @(Get-ExactTagReleases)
          if ($existingReleases.Count -gt 0) {
            $existingSummary = $existingReleases |
              ForEach-Object { "id=$($_.id),draft=$($_.draft)" }
            throw "GitHub Release 已存在，禁止覆盖或追加附件：$env:RELEASE_TAG ($($existingSummary -join '; '))"
          }

  windows-amd64:
    name: Windows amd64 发版包
    runs-on: windows-latest
    timeout-minutes: 20
    needs:
      - validate-release
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: backend/go.sum

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建并验证 Windows amd64
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-release.ps1 -Platform windows-amd64

      - name: 上传 Windows amd64 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          if-no-files-found: error
          path: |
            dist/release/agenttoolgate-windows-amd64.zip
            dist/release/agenttoolgate-evaluation-windows-amd64.zip

  linux-amd64:
    name: Linux amd64 发版包
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate-release
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: backend/go.sum

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建并验证 Linux amd64
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-release.ps1 -Platform linux-amd64

      - name: 上传 Linux amd64 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          if-no-files-found: error
          path: |
            dist/release/agenttoolgate-linux-amd64.tar.gz
            dist/release/agenttoolgate-evaluation-linux-amd64.tar.gz

  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    needs:
      - validate-release
      - windows-amd64
      - linux-amd64
    steps:
      - name: 检出已验证提交
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 发布前再次校验标签
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/validate-release-tag.ps1 `
            -TagName $env:RELEASE_TAG `
            -ExpectedCommitSha ${{ needs.validate-release.outputs.commit_sha }}

      - name: 下载平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: 生成统一 SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum \
            agenttoolgate-windows-amd64.zip \
            agenttoolgate-linux-amd64.tar.gz \
            agenttoolgate-evaluation-windows-amd64.zip \
            agenttoolgate-evaluation-linux-amd64.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: 创建、校验并发布 GitHub Release
        shell: pwsh
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_IS_PRERELEASE: ${{ needs.validate-release.outputs.is_prerelease }}
          VALIDATED_COMMIT_SHA: ${{ needs.validate-release.outputs.commit_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repositoryUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $createdReleaseId = $null

          function Get-ExactTagReleases {
            $matches = @()
            for ($page = 1; $page -le 1000; $page++) {
              $pageUri = "$repositoryUri/releases?per_page=100&page=$page"
              $releases = @(Invoke-RestMethod -Method Get -Uri $pageUri -Headers $headers)
              foreach ($release in $releases) {
                if ([string]::Equals(
                  [string]$release.tag_name,
                  $env:RELEASE_TAG,
                  [StringComparison]::Ordinal
                )) {
                  $matches += $release
                }
              }
              if ($releases.Count -lt 100) {
                return $matches
              }
            }
            throw "Release 列表超过 1000 页，拒绝在未完成扫描时继续。"
          }

          function Assert-OnlyOwnedRelease {
            param([Parameter(Mandatory = $true)][long]$ExpectedReleaseId)

            $matches = @(Get-ExactTagReleases)
            $foreign = @($matches | Where-Object { [long]$_.id -ne $ExpectedReleaseId })
            $owned = @($matches | Where-Object { [long]$_.id -eq $ExpectedReleaseId })
            if ($foreign.Count -gt 0) {
              $foreignIds = $foreign | ForEach-Object { [string]$_.id }
              throw "检测到非本轮创建的同标签 Release，禁止继续：$($foreignIds -join ', ')"
            }
            if ($owned.Count -ne 1) {
              throw "本轮 Release 未能在分页列表中唯一确认：$ExpectedReleaseId"
            }
            return $owned[0]
          }

          try {
            $existingReleases = @(Get-ExactTagReleases)
            if ($existingReleases.Count -gt 0) {
              throw "GitHub Release 已存在，禁止覆盖或追加附件：$env:RELEASE_TAG"
            }

            $assetPaths = @(
              "dist/release/agenttoolgate-windows-amd64.zip",
              "dist/release/agenttoolgate-linux-amd64.tar.gz",
              "dist/release/agenttoolgate-evaluation-windows-amd64.zip",
              "dist/release/agenttoolgate-evaluation-linux-amd64.tar.gz",
              "dist/release/SHA256SUMS"
            )
            $assets = foreach ($path in $assetPaths) {
              $item = Get-Item -LiteralPath $path
              if ($item.Length -le 0) {
                throw "Release 附件为空：$path"
              }
              $item
            }
            $duplicateNames = $assets | Group-Object Name | Where-Object Count -gt 1
            if ($duplicateNames) {
              throw "Release 附件名不唯一：$($duplicateNames.Name -join ', ')"
            }

            $createPayload = @{
              tag_name = $env:RELEASE_TAG
              target_commitish = $env:VALIDATED_COMMIT_SHA
              name = "AgentToolGate $env:RELEASE_TAG"
              draft = $true
              prerelease = [System.Convert]::ToBoolean($env:RELEASE_IS_PRERELEASE)
              generate_release_notes = $true
            } | ConvertTo-Json
            try {
              # 前置查询只用于快速失败；创建请求本身才是同标签 Release 的所有权边界。
              $release = Invoke-RestMethod `
                -Method Post `
                -Uri "$repositoryUri/releases" `
                -Headers $headers `
                -ContentType "application/json" `
                -Body $createPayload
            }
            catch {
              $response = $_.Exception.Response
              if ($null -ne $response -and [int]$response.StatusCode -eq 422) {
                throw "同标签 Release 已存在或被并发创建，禁止复用或覆盖：$env:RELEASE_TAG"
              }
              throw
            }
            $createdReleaseId = [long]$release.id
            if (
              -not $release.draft -or
              -not [string]::Equals(
                [string]$release.tag_name,
                $env:RELEASE_TAG,
                [StringComparison]::Ordinal
              )
            ) {
              throw "GitHub 返回的草稿 Release 与请求不一致。"
            }
            $ownedRelease = Assert-OnlyOwnedRelease -ExpectedReleaseId $createdReleaseId
            if (-not $ownedRelease.draft) {
              throw "本轮创建的 Release 未保持 draft 状态。"
            }

            $uploadUri = [string]$release.upload_url
            $templateStart = $uploadUri.IndexOf("{")
            if ($templateStart -ge 0) {
              $uploadUri = $uploadUri.Substring(0, $templateStart)
            }
            if ([string]::IsNullOrWhiteSpace($uploadUri)) {
              throw "GitHub 未返回有效的 Release upload_url。"
            }

            foreach ($asset in $assets) {
              $encodedName = [Uri]::EscapeDataString($asset.Name)
              $uploaded = Invoke-RestMethod `
                -Method Post `
                -Uri "$uploadUri?name=$encodedName" `
                -Headers $headers `
                -ContentType "application/octet-stream" `
                -InFile $asset.FullName
              if ($uploaded.name -ne $asset.Name -or [long]$uploaded.size -ne $asset.Length) {
                throw "Release 附件上传校验失败：$($asset.Name)"
              }
              if (-not [string]::IsNullOrWhiteSpace([string]$uploaded.digest)) {
                $expectedDigest = "sha256:$((Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
                if ($uploaded.digest -ne $expectedDigest) {
                  throw "Release 附件摘要校验失败：$($asset.Name)"
                }
              }
            }

            $stagedRelease = Invoke-RestMethod `
              -Method Get `
              -Uri "$repositoryUri/releases/$createdReleaseId" `
              -Headers $headers
            if (
              -not $stagedRelease.draft -or
              -not [string]::Equals(
                [string]$stagedRelease.tag_name,
                $env:RELEASE_TAG,
                [StringComparison]::Ordinal
              )
            ) {
              throw "草稿 Release 状态校验失败。"
            }
            if ($stagedRelease.assets.Count -ne $assets.Count) {
              throw "草稿 Release 附件数量不一致。"
            }
            foreach ($asset in $assets) {
              $remoteAsset = $stagedRelease.assets | Where-Object name -eq $asset.Name
              if ($null -eq $remoteAsset -or [long]$remoteAsset.size -ne $asset.Length) {
                throw "草稿 Release 缺少已校验附件：$($asset.Name)"
              }
            }
            $ownedRelease = Assert-OnlyOwnedRelease -ExpectedReleaseId $createdReleaseId
            if (-not $ownedRelease.draft) {
              throw "附件校验完成前 Release 已不再是 draft。"
            }

            $publishPayload = @{
              draft = $false
              prerelease = [System.Convert]::ToBoolean($env:RELEASE_IS_PRERELEASE)
            } | ConvertTo-Json
            $published = Invoke-RestMethod `
              -Method Patch `
              -Uri "$repositoryUri/releases/$createdReleaseId" `
              -Headers $headers `
              -ContentType "application/json" `
              -Body $publishPayload
            if (
              $published.draft -or
              -not [string]::Equals(
                [string]$published.tag_name,
                $env:RELEASE_TAG,
                [StringComparison]::Ordinal
              )
            ) {
              throw "GitHub Release 最终发布状态校验失败。"
            }
            $ownedRelease = Assert-OnlyOwnedRelease -ExpectedReleaseId $createdReleaseId
            if ($ownedRelease.draft) {
              throw "GitHub Release 发布后仍处于 draft 状态。"
            }
            Write-Host "GitHub Release published: $($published.html_url)"
          }
          catch {
            $originalError = $_
            if ($null -ne $createdReleaseId) {
              try {
                $currentRelease = Invoke-RestMethod `
                  -Method Get `
                  -Uri "$repositoryUri/releases/$createdReleaseId" `
                  -Headers $headers
                if (
                  $currentRelease.draft -and
                  [string]::Equals(
                    [string]$currentRelease.tag_name,
                    $env:RELEASE_TAG,
                    [StringComparison]::Ordinal
                  )
                ) {
                  Invoke-RestMethod `
                    -Method Delete `
                    -Uri "$repositoryUri/releases/$createdReleaseId" `
                    -Headers $headers | Out-Null
                  Write-Warning "已删除本次失败运行创建的草稿 Release。"
                }
                else {
                  Write-Warning "Release 已不是本次可安全删除的草稿，保留现场并禁止自动覆盖。"
                }
              }
              catch {
                Write-Warning "清理草稿 Release 失败；后续重跑会因同标签 Release 已存在而停止。"
              }
            }
            throw $originalError
          }
